<ion-header>
  <ion-toolbar>
    <ion-title>Convidados</ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/convidados/novo">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-spinner *ngIf="carregando"></ion-spinner>

  <ion-list *ngIf="!carregando && convidados.length > 0">

    <ion-item-sliding *ngFor="let convidado of convidados">

      <ion-item>
        <ion-label>
          <h2>{{ convidado.nome }}</h2>
          <p>{{ convidado.email }}</p>
          <ion-chip
            class="status-chip"
            [color]="statusColor(convidado)"
            (click)="abrirSelectorStatus(statusSelect)">

            <ion-label>
              {{ textoConfirmacao(convidado.confirmacaoPresenca) }}
            </ion-label>

          </ion-chip>

        <!-- Select invisível, apenas para interação -->
        <ion-select
          #statusSelect
          interface="popover"
          [(ngModel)]="convidado.confirmacaoPresenca"
          (ionChange)="alterarConfirmacao(convidado)"
          class="hidden-select">

          <ion-select-option [value]="null">
            Pendente
          </ion-select-option>

          <ion-select-option [value]="true">
            Confirmado
          </ion-select-option>

          <ion-select-option [value]="false">
            Não vai
          </ion-select-option>

        </ion-select>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deletar(convidado.id)">
          Excluir
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>

  </ion-list>

  <ion-text *ngIf="!carregando && convidados.length === 0">
    Nenhum convidado cadastrado.
  </ion-text>

</ion-content>
